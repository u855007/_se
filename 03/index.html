<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquitiTrack | 全方位資產追蹤器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 transition-all duration-300">
        <div class="p-6 flex items-center gap-3 text-white">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold">E</div>
            <span class="text-xl font-bold tracking-tight">EquitiTrack</span>
        </div>

        <nav class="flex-1 px-4 space-y-1 mt-4">
            <button class="nav-item active" id="nav-dashboard">
                <span>🏠</span><span>儀表板</span>
            </button>
            <button class="nav-item" id="nav-holdings">
                <span>💼</span><span>持有資產</span>
            </button>
            <button class="nav-item" id="nav-simulator">
                <span>📉</span><span>市場模擬器</span>
            </button>
        </nav>

        <div class="p-6 border-t border-slate-800 text-xs text-slate-500">
            &copy; 2026 EquitiTrack Inc.
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white border-b flex items-center justify-between px-8 shrink-0">
            <h1 id="page-title" class="text-xl font-bold text-slate-800">儀表板</h1>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-sm font-medium text-slate-800">Peter</p>
                    <p class="text-xs text-slate-400">Premium Account</p>
                </div>
                <div class="w-10 h-10 bg-indigo-100 rounded-full overflow-hidden border-2 border-white shadow-sm">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Peter" alt="avatar">
                </div>
            </div>
        </header>

        <div id="content-area" class="flex-1 overflow-y-auto p-8">
            <!-- Content injected by JS -->
        </div>
    </main>

    <!-- Asset Modal -->
    <div id="asset-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-800">新增持有資產</h3>
                <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>
            <form id="asset-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">選擇資產</label>
                    <select id="asset-select" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        <!-- Options injected by JS -->
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">持有數量</label>
                        <input type="number" id="asset-qty" step="any" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">平均買入價 ($)</label>
                        <input type="number" id="asset-price" step="any" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                </div>
                <div class="pt-4">
                    <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold hover:bg-indigo-700 transition shadow-lg">確認新增</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
