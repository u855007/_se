<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學習日誌</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header><div class="wrap brand"><span aria-hidden="true">▤</span> 學習日誌</div></header>
<main class="wrap">
  <section class="hero"><div><h1>把學到的寫下來。</h1><p>整理開發筆記、實驗結果與下一步。</p></div><button id="add">＋ 新增筆記</button></section>
  <section aria-labelledby="heading">
    <div class="summary"><h2 id="heading">我的筆記</h2><span id="count" aria-live="polite"></span></div>
    <div class="filters"><label>搜尋筆記<input id="search" type="search" placeholder="輸入標題、內文或分類"></label><label>分類<select id="filter"></select></label></div>
    <p id="status" role="status"></p>
    <div id="notes" class="grid"></div>
  </section>
</main>
<footer class="wrap">筆記儲存在目前的瀏覽器。</footer>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="form">
    <h2 id="editor-title"></h2>
    <label>標題<input name="title" required maxlength="80" autofocus></label>
    <label>分類<input name="category" maxlength="30" placeholder="例如 Cloudflare"></label>
    <label>筆記內容<textarea name="body" required maxlength="5000" rows="7"></textarea></label>
    <p id="error" role="alert"></p>
    <div class="actions"><button class="secondary" type="button" id="cancel">取消</button><button>儲存筆記</button></div>
  </form>
</dialog>
<template id="card">
  <article><div class="meta"><span class="tag"></span><time></time></div><h3></h3><p class="body"></p><div class="actions"><button class="secondary edit">編輯</button><button class="secondary remove">刪除</button></div></article>
</template>
</body>
</html>
